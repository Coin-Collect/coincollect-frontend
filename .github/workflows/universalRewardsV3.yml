name: Universal Rewards V3 frontend

on:
  pull_request:
    paths:
      - src/**
      - packages/**
      - scripts/**
      - '*.json'
      - '*.js'
      - 'eslint.config.cjs'
      - yarn.lock
      - .github/workflows/universalRewardsV3.yml
  push:
    branches: [pool-management]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint:v3
      - name: Verify WalletConnect URL decoder compatibility
        run: node scripts/verify-wallet-url-decoder.cjs
      - name: Audit dependency advisories
        run: node scripts/audit-dependencies.cjs "$RUNNER_TEMP/coincollect-yarn-audit.jsonl"
      - name: Upload complete dependency findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coincollect-yarn-audit
          path: ${{ runner.temp }}/coincollect-yarn-audit.jsonl
          if-no-files-found: error
      - run: yarn typecheck:v3
      - run: yarn test --runInBand --silent src/features/universalRewards src/features/nftPoolManager src/state/nftFarms
      - run: yarn typecheck
        if: ${{ !cancelled() }}
      - run: yarn typecheck:workspaces
        if: ${{ !cancelled() }}
      - run: yarn lint
        if: ${{ !cancelled() }}
      - run: yarn test --runInBand --silent
        if: ${{ !cancelled() }}
      - run: yarn build
        if: ${{ !cancelled() }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

  v3-browser-and-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ledger: [frozen, v36]
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: Coin-Collect/coincollect-smart-contracts
          ref: 39dca890de4c5c304de3fbfc32385ff9c56455a2
          path: contracts
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - working-directory: contracts/projects/universal-rewards-v3
        run: npm ci --workspaces=false --ignore-scripts
      - working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Compare generated frontend ABI against release contracts
        working-directory: contracts/projects/universal-rewards-v3
        run: |
          node scripts/export-abi.cjs "$RUNNER_TEMP/v3-abi.ts"
          cmp "$RUNNER_TEMP/v3-abi.ts" ../../../frontend/src/features/universalRewards/abi.ts
          node scripts/export-v36-abi.cjs "$RUNNER_TEMP/v36-abi.ts"
          cmp "$RUNNER_TEMP/v36-abi.ts" ../../../frontend/src/features/universalRewards/abiV36.ts
      - name: Run isolated production browser acceptance
        working-directory: frontend
        run: node scripts/run-v3-browser-acceptance.cjs ../contracts/projects/universal-rewards-v3
        env:
          COINCOLLECT_V36_FIXTURE: ${{ matrix.ledger == 'v36' && '1' || '0' }}
          V3_BROWSER_TREASURY_SCREENSHOT: ${{ runner.temp }}/v361-treasury-mobile.png
          V3_BROWSER_TREASURY_DESKTOP_SCREENSHOT: ${{ runner.temp }}/v361-treasury-desktop.png
      - name: Record exact audit pairing
        if: ${{ success() && matrix.ledger == 'v36' }}
        working-directory: frontend
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { createHash } = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const contractRepo = '../contracts'
          const manifest = fs.readFileSync(contractRepo + '/projects/universal-rewards-v3/release-manifest-v361.json')
          const evidence = {
            frontendCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            contractHandoffCommit: execFileSync('git', ['-C', contractRepo, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            contractsReleaseSourceCommit: '31ff0617b60aaafcbe155f4a266eab9e62455c8a',
            contractsReleaseManifestSha256: createHash('sha256').update(manifest).digest('hex'),
            standardInputSha256: JSON.parse(manifest).standardInputSha256,
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'audit-pairing.json'), JSON.stringify(evidence, null, 2) + '\n')
          NODE
      - name: Upload Treasury Chrome screenshots
        if: ${{ success() && matrix.ledger == 'v36' }}
        uses: actions/upload-artifact@v4
        with:
          name: v361-treasury-chrome
          path: |
            ${{ runner.temp }}/v361-treasury-*.png
            ${{ runner.temp }}/audit-pairing.json
          if-no-files-found: error
